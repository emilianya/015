        let i = 0;
        let e = document.querySelector(".nal-sp-e");
        setInterval(() => {
            if (i === 0) e.textContent = ".";
            if (i === 1) e.textContent = "..";
            if (i === 2) e.textContent = "...";
            if (i === 3) e.textContent = "";
            if (i === 3) i = -1;
            i++;
        }, 333)

        // Please don't look at this code it's midnight as I'm writing it and its horrendous
        // The escape codes ($0, $1, $2) do some weird stuff when back to back so there's weird fixes for that
		// let writingSpeed = 15;
		let writingSpeed = 7.5;
        let logs = [
            "Commencing System Check",
            "Memory Unit: Green",
            "Initializing Tactics Log",
            "Loading Geographic Data",
	        "Vitals: Green",
            "Remaining M$1P:$0$2 100%$0",
            "Black Box Temperature: $3Normal$0",
            "Black Box Internal Pressure: $3Normal$0",
            "Activating IFF",
            "Activating FCS",
            "Initializing Pod Connection",
            "Launching DBU Setup",
            "Activating Inertia Control System",
            "Activating Environmental Sensors",
            "Equipment Authentication: Complete",
            "Equipment Status: Green",
            "All Systems Green",
            "Combat Preparations Complete",

	        // "Initiating Nano Disposal",
	        // "Locating Nano Shinonome",
	        // "Nano Located",
	        // "Missile Status: Green",
	        // "Launching Missiles",
	        // "Target Annihilated",
	        // "Nano Disposal Complete"
        ];

		let fTimeout1 = 2500;
		let fTimeout2 = 1100;

		let logsShort = [
			"Commencing System Check",
			"All Systems Green",
			"Combat Preparations Complete"
		];

		if (sessionStorage.getItem("nal-loadedBefore")) {
			logs = logsShort;
			fTimeout1 = 1000;
			fTimeout2 = 700;
		}

        let logContainer = document.querySelector(".nal-b-c");
        let logLines = {};
        let logLineStrs = {};
        let logI = 0;
        let logJ = 0;
        let firstIter = true;
        let shouldFinish = true;
        let logInterval = setInterval(() => {
            if (logI >= logs.length) {
                console.log("Log complete")
                clearInterval(logInterval);
                    let add = true;
                    let blinkInterval = setInterval(() => {
                        // Start blinking the thing
	                    let line = logLines[logI - 1];
                        if (!line) return;
	                    let splitText = line.innerHTML.split("");
                        if (add) {
                            splitText.push("_");
                            add = false;
                        } else {
                            splitText[splitText.length - 1] = "";
                            add = true;
                        }
                        line.innerHTML = splitText.join("");
                    }, 750);
                    if (!shouldFinish) return;
                    setTimeout(() => {
                        clearInterval(blinkInterval);
                        document.querySelector(".nal-black").style.opacity = "1";
                        setTimeout(() => {
                            document.querySelector(".nal-g").style.display = "none";
                            document.querySelector(".nal-content").style.display = "block";
                            document.querySelector(".nal-black").style.opacity = "0";
                            // document.querySelector("html").style.backgroundImage = "url(bg_tile_l.png)";
							document.querySelector("html").style.backgroundImage = "";
							document.querySelector("html").style.backgroundColor = "#C1BD9F"
							sessionStorage.setItem("nal-loadedBefore", "true")
							if (localStorage.getItem("kitty") === "enabled") startOnekoHell()
							else if (localStorage.getItem("nokitty") !== "enabled") oneko();
                        }, fTimeout2)
                    }, fTimeout1)
                return;
            }
            let logLine = logs[logI];
            if (logJ >= logLine.length) {
                logJ = 0;
                logI++;
                return;
            }

            let logChar = logLine[logJ];
            let action = "";
            if (logChar === "$") {
                action = logLine[logJ + 1];
            }
            console.log(`Logging character ${logChar} of ${logLine}`)
	        if (action) console.log(`Extra action: ${action}`)
	        switch (action) {
		        case "":
                    break;
                case "1":
                    console.warn("$1")
                    logLineStrs[logI] += "<span style=\"letter-spacing: 0.0rem\">";
                    logJ += 2;
                    break;
                case "2":
                    console.warn("$2")
                    logLineStrs[logI] += "<span class=\"nal-b-lk\">";
                    logJ += 2;
                    break;
                case "3":
                    console.warn("$3")
                    logLineStrs[logI] += "<span class=\"nal-b-lk2\">";
                    logJ += 2;
                    break;
		        case "0":
                    console.warn("$0")
                    logLineStrs[logI] += "</span>"
			        if (logJ === logLine.length - 2) {
                        console.warn("$0 as last")
                        firstIter = false;
			        } else {
			        }
                    logJ += 2;
			        break;
	        }
            logChar = logLine[logJ];

	        if (!logLines[logI]) {
                logLines[logI] = document.createElement("p");
                logLines[logI].classList.add("nal-ca");
                logLines[logI].classList.add("nal-b-l");
                logLines[logI].innerHTML = "";
                logLineStrs[logI] = "";
		        logContainer.appendChild(logLines[logI]);
	        }
            if (!action) {
                if (firstIter) {
                    console.log(`First iter, writing ${logLine[0]} to ${logLines[logI].innerHTML}`)
                    logLineStrs[logI] += logLine[0]
                } else {
                    let text = logLineStrs[logI];
                    console.log(`Second iter, writing ${logChar} to ${text} in place of ${text[text.length - 1]}`)
                    let splitText = text.split("");
                    if (splitText[splitText.length - 1] === ">") {
                        splitText.push(logChar)
                    }
                    splitText[splitText.length - 1] = logChar;
                    logLineStrs[logI] = splitText.join("");
                }
            }
            logLines[logI].innerHTML = logLineStrs[logI];
            console.log(logLineStrs[logI], logLines[logI].innerHTML)

            if (firstIter) firstIter = false
	        else {
                firstIter = true;
                logJ++;
            }
        }, writingSpeed);

		document.querySelectorAll(".nal-header-btn").forEach(e => {
			e.onclick = () => {
				document.querySelectorAll(".nal-header-btn-selected").forEach(s => {
					s.classList.remove("nal-header-btn-selected")
					let section = s.getAttribute("data-section")
					document.querySelector(`#nal-section-${section}`).style.display = "none";
					flipChildSvgColors(s)
				})
				e.classList.add("nal-header-btn-selected")
				let section = e.getAttribute("data-section")
				document.querySelector(`#nal-section-${section}`).style.display = "";
				flipChildSvgColors(e)
			}
		})

		function flipChildSvgColors(e) {
			//#9f9b7f
			//#434038ff
			e.querySelectorAll("svg").forEach(svg => {
				let newContent = svg.innerHTML.replaceAll("#9f9b7f", "#temp1")
				newContent = newContent.replaceAll("#434038", "#temp2")
				newContent = newContent.replaceAll("#temp1", "#434038")
				newContent = newContent.replaceAll("#temp2", "#9f9b7f")
				svg.innerHTML = newContent;
			})
		}

		// up,up,down,down,left,right,left,right,B,A
		const konami = '38,38,40,40,37,39,37,39,66,65';
		// nichijou
		const nichijou = '78,73,67,72,73,74,79,85';
		// nichijou
		const java = '74,65,86,65';
		// kills
		const kills = "75,73,76,76,83";
		// kitty
		const kitty = "75,73,84,84,89";
		// nokitty
		const nokitty = "78,79,75,73,84,84,89";

		return event => {
			kkeys.push(event.keyCode);
			if (kkeys.toString().indexOf(konami) >= 0) {
				callback(event, "konami");
				kkeys = [];
			} else if (kkeys.toString().indexOf(nichijou) >= 0) {
				callback(event, "nichijou");
				kkeys = [];
			} else if (kkeys.toString().indexOf(kills) >= 0) {
				callback(event, "kills");
				kkeys = [];
			} else if (kkeys.toString().indexOf(kitty) >= 0 && !(kkeys.toString().indexOf(nokitty) >= 0)) {
				callback(event, "kitty");
				kkeys = [];
			} else if (kkeys.toString().indexOf(nokitty) >= 0) {
				callback(event, "nokitty");
				kkeys = [];
			} else if (kkeys.toString().indexOf(java) >= 0) {
				callback(event, "java");
				kkeys = [];
			}
		};
	}
	const handler = konami((event, type) => {
		console.log(event, type)
		if (type === "konami") {
			if (konami.triggered) return;
			konami.triggered = true;
			let clip = new Audio("/assets/media/kagome-kagome.mp3");
			clip.volume = 0.2;
			clip.play()
			clip.onended = () => {
				konami.triggered = false;
			}
		} else if (type === "nichijou") {
			document.querySelectorAll("#oneko").forEach(e => e.remove());
			clearInterval(onekoSpawner)
			document.body.parentNode.innerHTML = `<head><meta name="viewport" content="width=device-width"></head><body style="background-color: #000000;"><video style="position: fixed; width: 100%; height: 100%;" controls autoplay src="/assets/random/the.webm" type="video/webm" onended="window.location.reload()" /></body>`
		} else if (type === "kills") {
			alert(`You have committed murder ${localStorage.getItem("onekoKills") || 0} times`)
		} else if (type === "kitty") {
			if (localStorage.getItem("kitty") !== "enabled") {
				localStorage.setItem("kitty", "enabled")
				localStorage.setItem("nokitty", "disabled")
				startOnekoHell()
			} else {
				localStorage.setItem("kitty", "disabled")
				window.location.reload();
			}
		} else if (type === "nokitty") {
			if (localStorage.getItem("nokitty") !== "enabled") {
				localStorage.setItem("nokitty", "enabled")
				localStorage.setItem("kitty", "disabled")
				window.location.reload();
			} else {
				localStorage.setItem("nokitty", "disabled")
				window.location.reload();
			}
		} else if (type === "java") {
			document.querySelectorAll("#oneko").forEach(e => e.remove());
			clearInterval(onekoSpawner)
			document.body.parentNode.innerHTML = `<head><meta name="viewport" content="width=device-width"></head><body style="background-color: #000000;"><img style="position: fixed; max-width: 100%; max-height: 100%;" src="/assets/java.png"/></body>`
		}
	});
	window.addEventListener('keydown', handler);
